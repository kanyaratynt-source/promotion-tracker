
<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promotion Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Prompt',sans-serif}
body{background:#f5f7fb;color:#1e293b}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#0f172a;color:white;padding:24px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.logo-box{width:46px;height:46px;background:#2563eb;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.menu div{padding:14px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.menu .active{background:#2563eb}
.main{margin-left:240px;padding:30px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.upload{background:#2563eb;color:white;padding:12px 18px;border-radius:12px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin:28px 0}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.card h2{margin-top:10px;font-size:30px}
.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:15px;margin-bottom:18px}
input,select{padding:12px;border:1px solid #dbe3ef;border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:14px;border-bottom:1px solid #eef2f7;text-align:left}
tbody tr:hover{background:#f8fafc}
.badge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.finish{background:#DCFCE7;color:#166534}
.pending{background:#FEE2E2;color:#991B1B}
.processing{background:#FEF3C7;color:#92400E}
@media(max-width:900px){
.sidebar{display:none}
.main{margin-left:0;padding:18px}
.filters{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">
<div class="logo-box">PT</div>
<div>
<h3>Promotion Tracker</h3>
<small>Sales Dashboard</small>
</div>
</div>

<div class="menu">
<div class="active">📊 Dashboard</div>
<div>🏪 ร้านค้า</div>
<div>💰 โปรโมชั่น</div>
<div>📈 รายงาน</div>
<div>⚙️ ตั้งค่า</div>
</div>
</div>

<div class="main">

<div class="top">
<div>
<h1>Promotion Dashboard</h1>
<p>ตรวจสอบการจ่ายโปรโมชั่นแบบเรียลไทม์</p>
</div>

<label class="upload">
📤 Upload Excel
<input id="file" type="file" hidden accept=".xlsx,.xls">
</label>

</div>

<div class="cards">

<div class="card">
<div>ยอดจ่ายรวม</div>
<h2 id="amount">฿0</h2>
</div>

<div class="card">
<div>จ่ายแล้ว</div>
<h2 id="paid">0</h2>
</div>

<div class="card">
<div>ค้างจ่าย</div>
<h2 id="pending">0</h2>
</div>

<div class="card">
<div>ร้านค้า</div>
<h2 id="shops">0</h2>
</div>

</div>

<div class="panel">

<div class="filters">

<input id="search" placeholder="🔍 ค้นหาร้านค้า">

<select id="status">
<option value="">ทุกสถานะ</option>
<option>Finish</option>
<option>Pending</option>
<option>Processing</option>
</select>

</div>

<table>

<thead>

<tr>

<th>ร้านค้า</th>
<th>ASM</th>
<th>Period</th>
<th>ยอดจ่าย</th>
<th>สถานะ</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>
let rows=[];

const file=document.getElementById("file");
const search=document.getElementById("search");
const status=document.getElementById("status");

file.onchange=async e=>{

const wb=XLSX.read(await e.target.files[0].arrayBuffer());

const ws=wb.Sheets[wb.SheetNames[0]];

rows=XLSX.utils.sheet_to_json(ws,{defval:""});

render();

}

search.oninput=render;
status.onchange=render;

function amount(r){

return Number(r["ยอดจ่าย"]||r["Amount"]||0)||0;

}

function render(){

let data=[...rows];

if(search.value){

data=data.filter(r=>(r["Customer Name"]||"").toLowerCase().includes(search.value.toLowerCase()));

}

if(status.value){

data=data.filter(r=>(r["Status"]||"Pending")==status.value);

}

let total=0;
let paid=0;
const stores=new Set();

tableBody.innerHTML="";

data.forEach(r=>{

const a=amount(r);

total+=a;

stores.add(r["Customer Name"]);

const st=(r["Status"]||"Pending");

if(st=="Finish") paid++;

tableBody.innerHTML+=`
<tr>
<td>${r["Customer Name"]||"-"}</td>
<td>${r["ASM"]||"-"}</td>
<td>${r["Period"]||"-"}</td>
<td>฿${a.toLocaleString()}</td>
<td><span class="badge ${st=="Finish"?"finish":st=="Pending"?"pending":"processing"}">${st}</span></td>
</tr>
`;

});

amount.innerHTML="฿"+total.toLocaleString();

paid.innerHTML=paid;

pending.innerHTML=data.length-paid;

shops.innerHTML=stores.size;

}
</script>
<script src="app.js"></script>
</body>
</html>
