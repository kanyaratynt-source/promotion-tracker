<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Promotion Tracker</title><script src='https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js'></script><style>body{font-family:Arial;background:#f6f8fb;padding:24px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:18px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee}.badge{padding:4px 10px;border-radius:999px;background:#dcfce7;color:#166534}</style></head><body><h1>Promotion Tracker</h1><div class='card'><input type='file' id='file' accept='.xlsx,.xls'></div><div class='kpis'><div class='card'><div>ยอดจ่ายรวม</div><h2 id='total'>฿0</h2></div><div class='card'><div>จ่ายแล้ว</div><h2 id='done'>0</h2></div><div class='card'><div>ร้านค้า</div><h2 id='shops'>0</h2></div></div><div class='card'><table id='tbl'><thead><tr><th>ร้านค้า</th><th>ASM</th><th>ยอด</th><th>สถานะ</th></tr></thead><tbody></tbody></table></div><script>document.getElementById('file').onchange=async e=>{const f=e.target.files[0];const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});let total=0,done=0;const s=new Set();const tb=document.querySelector('#tbl tbody');tb.innerHTML='';rows.forEach(r=>{const vals=Object.values(r);const name=r['Customer Name']||r['Customer']||vals[1]||'';const asm=r['ASM']||'';const st=(r['Status']||'Pending').toString();const amt=Number(r['Amount']||r['ยอดจ่าย']||0)||0;total+=amt;if(st.toLowerCase().includes('finish'))done++;s.add(name);tb.insertAdjacentHTML('beforeend',`<tr><td>${name}</td><td>${asm}</td><td>${amt.toLocaleString()}</td><td><span class='badge'>${st}</span></td></tr>`)});document.getElementById('total').textContent='฿'+total.toLocaleString();document.getElementById('done').textContent=done;document.getElementById('shops').textContent=s.size;};</script></body></html>
