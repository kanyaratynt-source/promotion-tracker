
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promotion Tracker Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Prompt",sans-serif}
body{background:#F4F7FB;color:#1E293B}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0F172A;color:#fff;padding:24px}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:36px}
.logo-box{width:46px;height:46px;border-radius:14px;background:#2563EB;display:flex;align-items:center;justify-content:center;font-weight:700}
.menu button{width:100%;border:none;background:transparent;color:#CBD5E1;text-align:left;padding:14px;border-radius:12px;cursor:pointer}
.menu button.active,.menu button:hover{background:#2563EB;color:#fff}
.main{flex:1;padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.upload{background:#2563EB;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin:24px 0}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:20px}
input,select{padding:12px;border:1px solid #D9E2EC;border-radius:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden}
th,td{padding:14px;border-bottom:1px solid #EEF2F7}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F8FAFC}
.badge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.finish{background:#DCFCE7;color:#166534}
.pending{background:#FEE2E2;color:#991B1B}
.processing{background:#FEF3C7;color:#92400E}
.drawer{position:fixed;right:-520px;top:0;width:520px;height:100%;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.12);transition:.3s;padding:24px;overflow:auto}
.drawer.open{right:0}
.drawer h2{margin-bottom:12px}
.doc{display:block;padding:12px;border:1px solid #E2E8F0;border-radius:10px;margin:10px 0;color:#2563EB;text-decoration:none}
@media(max-width:900px){
.sidebar{display:none}
.main{padding:16px}
.filters{grid-template-columns:1fr}
.drawer{width:100%}
}
</style>
</head>
<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">
<div class="logo-box">PT</div>
<div>
<b>Promotion Tracker</b><br>
<small>Sales Dashboard</small>
</div>
</div>

<div class="menu">
<button class="active">📊 Dashboard</button>
<button>🏪 ร้านค้า</button>
<button>💰 โปรโมชั่น</button>
<button>📄 เอกสาร</button>
<button>📈 รายงาน</button>
</div>

</aside>

<main class="main">

<div class="top">

<div>
<h1>Promotion Dashboard</h1>
<p>ระบบติดตามการจ่ายโปรโมชั่น</p>
</div>

<label class="upload">
📤 Upload Excel
<input hidden id="file" type="file" accept=".xlsx,.xls">
</label>

</div>

<div class="cards">

<div class="card">
<div>ยอดจ่ายรวม</div>
<h2 id="amount">฿0</h2>
</div>

<div class="card">
<div>จ่ายแล้ว</div>
<h2 id="paid">0</h2>
</div>

<div class="card">
<div>ค้างจ่าย</div>
<h2 id="pending">0</h2>
</div>

<div class="card">
<div>ร้านค้า</div>
<h2 id="shops">0</h2>
</div>

</div>

<div class="filters">

<input id="search" placeholder="ค้นหาร้านค้า">

<select id="asm">
<option value="">ทุก ASM</option>
</select>

<select id="status">
<option value="">ทุกสถานะ</option>
<option>Finish</option>
<option>Pending</option>
<option>Processing</option>
</select>

</div>

<table>

<thead>

<tr>

<th>ร้านค้า</th>
<th>ASM</th>
<th>Period</th>
<th>ยอดจ่าย</th>
<th>Status</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</main>

</div>

<div id="drawer" class="drawer"></div>

  
<script>
let allRows = [];
let filteredRows = [];

const fileInput = document.getElementById("file");
const searchInput = document.getElementById("search");
const asmFilter = document.getElementById("asm");
const statusFilter = document.getElementById("status");
const tableBody = document.getElementById("tableBody");
const drawer = document.getElementById("drawer");

// โหลด Excel
fileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  allRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

  loadASM();
  renderTable();
});

// โหลด ASM ลง Filter
function loadASM() {
  const list = [...new Set(allRows.map(r => r["ASM"]).filter(Boolean))];
  asmFilter.innerHTML = '<option value="">ทุก ASM</option>';
  list.forEach(a => {
    asmFilter.innerHTML += `<option>${a}</option>`;
  });
}

// อ่านยอดเงิน (รองรับชื่อคอลัมน์ไทย)
function getAmount(r) {
  return Number(
    r["ยอดจ่าย"] ||
    r["Amount"] ||
    r["ยอดจ่ายรวม"] ||
    0
  ) || 0;
}

// Render ตาราง
function renderTable() {

  filteredRows = [...allRows];

  // Search
  if (searchInput.value) {
    filteredRows = filteredRows.filter(r =>
      (r["Customer Name"] || "").toLowerCase()
        .includes(searchInput.value.toLowerCase())
    );
  }

  // ASM Filter
  if (asmFilter.value) {
    filteredRows = filteredRows.filter(r => r["ASM"] === asmFilter.value);
  }

  // Status Filter
  if (statusFilter.value) {
    filteredRows = filteredRows.filter(r =>
      (r["Status"] || "Pending") === statusFilter.value
    );
  }

  tableBody.innerHTML = "";

  let total = 0;
  let paid = 0;
  const stores = new Set();

  filteredRows.forEach((r, i) => {

    const amount = getAmount(r);
    total += amount;

    stores.add(r["Customer Name"]);

    const status = (r["Status"] || "Pending");

    if (status.toLowerCase() === "finish") paid++;

    const cls =
      status === "Finish" ? "finish" :
      status === "Pending" ? "pending" :
      "processing";

    tableBody.innerHTML += `
      <tr onclick="openDetail(${i})">
        <td>${r["Customer Name"] || "-"}</td>
        <td>${r["ASM"] || "-"}</td>
        <td>${r["Period"] || "-"}</td>
        <td>฿${amount.toLocaleString()}</td>
        <td><span class="badge ${cls}">${status}</span></td>
      </tr>`;
  });

  amountCard.textContent = "฿" + total.toLocaleString();
  paidCard.textContent = paid;
  pendingCard.textContent = filteredRows.length - paid;
  shopsCard.textContent = stores.size;
}

// KPI
const amountCard = document.getElementById("amount");
const paidCard = document.getElementById("paid");
const pendingCard = document.getElementById("pending");
const shopsCard = document.getElementById("shops");

// Filter Events
searchInput.addEventListener("input", renderTable);
asmFilter.addEventListener("change", renderTable);
statusFilter.addEventListener("change", renderTable);

// เปิดรายละเอียด
window.openDetail = function(index){

  const r = filteredRows[index];

  drawer.classList.add("open");

  drawer.innerHTML = `
    <button onclick="drawer.classList.remove('open')"
      style="float:right;background:none;border:none;font-size:28px;cursor:pointer">
      ×
    </button>

    <h2>${r["Customer Name"] || "-"}</h2>

    <p><b>Customer Code:</b> ${r["Customer Code"] || "-"}</p>

    <p><b>ASM:</b> ${r["ASM"] || "-"}</p>

    <p><b>Period:</b> ${r["Period"] || "-"}</p>

    <p><b>ยอดจ่าย:</b> ฿${getAmount(r).toLocaleString()}</p>

    <p><b>Status:</b> ${r["Status"] || "Pending"}</p>

    <hr style="margin:20px 0">

    <h3>รายละเอียดโปรโมชั่น</h3>

    <p>${(r["รายละเอียด"] || "-").replace(/\n/g,"<br>")}</p>

    <hr style="margin:20px 0">

    <h3>สินค้า</h3>

    <p>${(r["Product"] || "-").replace(/\n/g,"<br>")}</p>

    <hr style="margin:20px 0">

    <h3>เอกสาร</h3>

    ${
      r["Memo"] ?
      `<a class="doc" href="${r["Memo"]}" target="_blank">📄 เปิดรายละเอียด (Memo)</a>` : ""
    }

    ${
      r["SCN"] ?
      `<a class="doc" href="${r["SCN"]}" target="_blank">📄 ${r["SCN"]}</a>` : ""
    }

    ${
      r["Inv."] ?
      `<a class="doc" href="${r["Inv."]}" target="_blank">📄 ${r["Inv."]}</a>` : ""
    }

    <hr style="margin:20px 0">

    <h3>หมายเหตุ</h3>

    <p>${r["หมายเหตุ"] || "-"}</p>

  `;
}
</script>
</body>
</html>
